<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Converza SFU Lab</title>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; background: #0e1013; color: #f1f1f3; }
        header { padding: 14px 20px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
        h1 { font-size: 1.1rem; margin: 0; }
        #status { color: #2d8cff; }
        #stats { padding: 0 20px 12px; font-size: 0.85rem; color: #a7a9ac; }
        #videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; padding: 0 20px 20px; }
        .tile { position: relative; background: #202124; border-radius: 10px; overflow: hidden; aspect-ratio: 4 / 3; }
        .tile video { width: 100%; height: 100%; object-fit: cover; }
        .tile span { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.55); padding: 3px 8px; border-radius: 6px; font-size: 0.8rem; }
        #local { transform: scaleX(-1); }
    </style>
</head>
<body>
    <header>
        <h1>Converza SFU Lab</h1>
        <span>Room: <strong id="room"></strong></span>
        <span id="status">Starting...</span>
    </header>
    <div id="stats">Waiting for stats...</div>
    <div id="videos">
        <div class="tile"><video id="local" autoplay playsinline muted></video><span>You</span></div>
    </div>
    <script src="bundle.js"></script>
</body>
</html>
