# Used only once, before the HTTPS certificate exists: answers Let's
# Encrypt's check on port 80 so the certificate can be issued.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
