# Converza on one domain: the React build, the REST API and Socket.IO.
# Media (video/audio) does not go through Nginx: browsers send it straight
# to mediasoup on the server's public IP, UDP/TCP ports 40000-40999.
# __DOMAIN__, __CERT_PATH__ and __KEY_PATH__ are filled in by setup-ec2.sh.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Let's Encrypt renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate __CERT_PATH__;
    ssl_certificate_key __KEY_PATH__;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/converza;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO needs the WebSocket upgrade headers, and a long timeout so
    # idle meetings aren't disconnected.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Build files have content hashes in their names, so they can be cached.
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Every other path (/home, /guest, /abc123...) is a React route.
    location / {
        try_files $uri /index.html;
    }
}
